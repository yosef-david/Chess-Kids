name: Chess Kids Windows installer
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@v4
        with:
          name: Chess-Kids-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
